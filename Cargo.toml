[workspace]
resolver = "2"
members = [
    "crates/ftp-utils-core",
    "tools/ftpdiff",
    "tools/ftpops",
]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
suppaftp = { version = "10", features = ["native-tls"] }
clap = { version = "4", features = ["derive"] }
glob = "0.3"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"
csv = "1"
colored = "2"
tempfile = "3"
rpassword = "7"
